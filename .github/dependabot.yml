version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript <6.1 only; revisit when it
      # supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /react
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript <6.1 only; revisit when it
      # supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /faker
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript <6.1 only; revisit when it
      # supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: pub
    directory: /dart
    schedule:
      interval: monthly

  - package-ecosystem: pub
    directory: /flutter
    schedule:
      interval: monthly
    ignore:
      # qr 4 needs Dart ^3.11 (Flutter 3.41+) and drops the API we use
      # (QrCode.fromData, QrErrorCorrectLevel.L/M/Q/H). Stay on qr 3.x for now.
      - dependency-name: qr
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
