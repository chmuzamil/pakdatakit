name: CI

on:
  push:
    branches: [main, master]
  # Any base branch, so that a pull request stacked on another one is tested.
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Bundle size of a CNIC-only import, and which datasets each import
      # pulls in (scripts/check-size.mjs).
      - run: npm run size

  react:
    name: react (pakdatakit-react)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            react/package-lock.json

      # pakdatakit-react develops against the repo's own build of pakdatakit.
      - run: npm ci && npm run build

      - run: npm ci
        working-directory: react

      - run: npm run lint
        working-directory: react

      - run: npm run typecheck
        working-directory: react

      - run: npm test
        working-directory: react

      - run: npm run build
        working-directory: react

  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v7

      # The Python package must match the TypeScript library: regenerate the
      # shared test vectors and data copies, and fail if they were not committed.
      - name: Check test vectors and data are up to date
        run: |
          npm ci
          npm run build
          node scripts/generate-test-vectors.mjs
          git diff --exit-code -- test-vectors python/src/pakdatakit/data

      - name: Run tests
        working-directory: python
        run: uv run --python ${{ matrix.python-version }} --with pytest pytest -q

      - name: Build wheel and sdist
        working-directory: python
        run: uv build

  faker:
    name: faker (pakdatakit-faker)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            faker/package-lock.json

      # pakdatakit-faker develops against the repo's own build of pakdatakit.
      - run: npm ci && npm run build

      - run: npm ci
        working-directory: faker

      - run: npm run lint
        working-directory: faker

      - run: npm run typecheck
        working-directory: faker

      - run: npm test
        working-directory: faker

      - run: npm run build
        working-directory: faker

  dart:
    name: dart (pakdatakit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The generated Dart data embeds tables from Node's ICU and is formatted
      # by dart format, so pin both to the versions it was generated with.
      # Update these together with a regeneration (node scripts/generate-dart-data.mjs).
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      # dart format needs the package resolved to use its language version.
      - run: dart pub get
        working-directory: dart

      # The embedded data must match data/*.json.
      - name: Check generated Dart data is up to date
        run: |
          node scripts/generate-dart-data.mjs
          git diff --exit-code -- dart/lib/src/data

      - run: dart format --output=none --set-exit-if-changed .
        working-directory: dart

      - run: dart analyze --fatal-infos
        working-directory: dart

      # Runs the 12,000+ shared test vectors from test-vectors/.
      - run: dart test
        working-directory: dart

      - run: dart pub publish --dry-run
        working-directory: dart

  flutter:
    name: flutter (pakdatakit_flutter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec_overrides.yaml points pakdatakit at ../dart in this repo.
      - run: flutter pub get
        working-directory: flutter

      - run: dart format --output=none --set-exit-if-changed .
        working-directory: flutter

      - run: flutter analyze --fatal-infos
        working-directory: flutter

      - run: flutter test
        working-directory: flutter

      - run: flutter pub get && flutter analyze --fatal-infos
        working-directory: flutter/example

  dotnet:
    name: dotnet (PakDataKit, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # The case-mapping table embeds data from Node's ICU, so pin Node to the
      # version it was generated with (the same pin as the dart job).
      - uses: actions/setup-node@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 24.15.0

      - name: Check generated .NET data is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/generate-dotnet-data.mjs
          git diff --exit-code -- dotnet/src/PakDataKit/Generated

      - run: dotnet build -c Release
        working-directory: dotnet

      # Runs the 12,000+ shared test vectors from test-vectors/.
      - run: dotnet test -c Release --no-build
        working-directory: dotnet

      # Builds the NuGet packages; nothing is pushed.
      - run: dotnet pack -c Release --no-build -o artifacts
        working-directory: dotnet

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nuget-packages
          path: dotnet/artifacts/*.nupkg
          if-no-files-found: error

  php:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']

    steps:
      - uses: actions/checkout@v7

      # The generated PHP data embeds tables from Node's ICU, so pin Node to
      # the version it was generated with (the same pin as the dart job).
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0

      # The embedded data must match data/*.json.
      - name: Check generated PHP data is up to date
        run: |
          node scripts/generate-php-data.mjs
          git diff --exit-code -- php/data

      # Without intl, to prove the package does not rely on it.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, :intl
          coverage: none

      - run: composer install --no-interaction --no-progress
        working-directory: php

      # Runs the 12,000+ shared test vectors from test-vectors/, the fuzz
      # tests and the Laravel bridge tests.
      - run: composer test
        working-directory: php

  vue:
    name: vue (pakdatakit-vue)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vue/package-lock.json

      # pakdatakit-vue develops against the repo's own build of pakdatakit.
      - run: npm ci && npm run build

      - run: npm ci
        working-directory: vue

      - run: npm run lint
        working-directory: vue

      - run: npm run typecheck
        working-directory: vue

      - run: npm test
        working-directory: vue

      - run: npm run build
        working-directory: vue

  angular:
    name: angular ${{ matrix.angular }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 17 is what angular/package.json develops and builds against; the
        # others are installed over it. Each needs its own TypeScript and
        # zone.js. Raise the last row (and the peer range) when a new major
        # is released.
        include:
          - angular: 17
          - angular: 18
            typescript: '5.5'
            zone: '0.14'
          - angular: 19
            typescript: '5.8'
            zone: '0.15'
          - angular: 22
            typescript: '6.0'
            zone: '0.16'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            angular/package-lock.json

      # pakdatakit-angular develops against the repo's own build of pakdatakit.
      - run: npm ci && npm run build

      - run: npm ci
        working-directory: angular

      - name: Install Angular ${{ matrix.angular }}
        if: matrix.angular != 17
        working-directory: angular
        env:
          NG: ${{ matrix.angular }}
          TS: ${{ matrix.typescript }}
          ZONE: ${{ matrix.zone }}
        run: >
          npm install --no-save --no-audit --no-fund --legacy-peer-deps
          @angular/common@$NG @angular/compiler@$NG @angular/compiler-cli@$NG
          @angular/core@$NG @angular/forms@$NG @angular/platform-browser@$NG
          @angular/platform-browser-dynamic@$NG ng-packagr@$NG
          typescript@$TS zone.js@$ZONE

      - run: node -p "'Angular ' + require('@angular/core/package.json').version + ', TypeScript ' + require('typescript/package.json').version"
        working-directory: angular

      - run: npm run lint
        if: matrix.angular == 17
        working-directory: angular

      - run: npm run typecheck
        working-directory: angular

      - run: npm test
        working-directory: angular

      # Builds the Angular package format with ng-packagr.
      - run: npm run build
        working-directory: angular
