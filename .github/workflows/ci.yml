name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  react:
    name: react (pakdatakit-react)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            react/package-lock.json

      # pakdatakit-react develops against the repo's own build of pakdatakit.
      - run: npm ci && npm run build

      - run: npm ci
        working-directory: react

      - run: npm run lint
        working-directory: react

      - run: npm run typecheck
        working-directory: react

      - run: npm test
        working-directory: react

      - run: npm run build
        working-directory: react

  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v7

      # The Python package must match the TypeScript library: regenerate the
      # shared test vectors and data copies, and fail if they were not committed.
      - name: Check test vectors and data are up to date
        run: |
          npm ci
          npm run build
          node scripts/generate-test-vectors.mjs
          git diff --exit-code -- test-vectors python/src/pakdatakit/data

      - name: Run tests
        working-directory: python
        run: uv run --python ${{ matrix.python-version }} --with pytest pytest -q

      - name: Build wheel and sdist
        working-directory: python
        run: uv build
