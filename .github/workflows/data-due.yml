name: Dataset update due

# Every Monday, opens one issue per dataset whose `nextExpectedUpdate` in
# data/manifest.json is before today (scripts/check-manifest.mjs --due), with
# that dataset's section of scripts/data-refresh.md. An issue already opened
# for the same dataset and date (open or closed) is not opened again; bump
# `nextExpectedUpdate` when the data is refreshed.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  due:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Open an issue for each dataset that is due
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/check-manifest.mjs --due > due.json
          count=$(jq length due.json)
          echo "Datasets due: ${count}"
          gh label create data --repo "$REPO" --color 0e8a16 --description "Datasets and their sources" 2>/dev/null || true
          for i in $(seq 0 $((count - 1))); do
            id=$(jq -r ".[$i].id" due.json)
            title_ds=$(jq -r ".[$i].title" due.json)
            next=$(jq -r ".[$i].nextExpectedUpdate" due.json)
            title="Data update due: ${title_ds} (${id}, expected ${next})"
            existing="$(gh issue list --repo "$REPO" --state all --search "\"${title}\" in:title" --json number --jq 'length')"
            if [ "$existing" != "0" ]; then
              echo "Already opened: ${title}"
              continue
            fi
            {
              echo "\`${id}\` was expected to change by **${next}** ($(jq -r ".[$i].updateCadence" due.json))."
              echo
              echo "- **Source:** $(jq -r ".[$i].issuer" due.json), $(jq -r ".[$i].sourceReference" due.json)"
              echo "- **URL:** $(jq -r ".[$i].sourceUrl" due.json)"
              echo "- **Last retrieved:** $(jq -r ".[$i].retrievedAt" due.json)"
              echo
              echo "Check the source. If it changed, update the data and its manifest entry (a new record for a new year or period; never overwrite a past one). Either way, set \`retrievedAt\` and the next \`nextExpectedUpdate\` in data/manifest.json."
              echo
              echo "From [scripts/data-refresh.md](https://github.com/${REPO}/blob/main/scripts/data-refresh.md):"
              echo
              awk -v id="$id" '
                /^## / { p = 0 }
                index($0, "<!-- dataset: " id " -->") { p = 1 }
                p
              ' scripts/data-refresh.md
            } > body.md
            gh issue create --repo "$REPO" --title "$title" --label data --body-file body.md
          done
