name: Docs

# Builds the API reference (TypeDoc) plus llms.txt / llms-full.txt and
# publishes them to GitHub Pages at https://chmuzamil.github.io/pakdatakit/.
# Runs on each release tag so the docs match the version on npm, and can be
# run by hand. Requires Settings → Pages → Source: GitHub Actions.
#
# Once pakdatakit.dev is live, setting the repository variable
# PDK_DOCS_STUB=true turns this site into redirects only: every old page
# points (canonical + meta refresh) to its new address on pakdatakit.dev,
# from site/api-redirects.json. Off until then.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: vars.PDK_DOCS_STUB != 'true'
      - run: npm run build
        if: vars.PDK_DOCS_STUB != 'true'
      - run: npm run docs
        if: vars.PDK_DOCS_STUB != 'true'

      - name: Redirect-only site (pakdatakit.dev is live)
        if: vars.PDK_DOCS_STUB == 'true'
        run: node scripts/docs-stub.mjs docs-site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
