name: Release .NET packages

# Publishes PakDataKit, PakDataKit.DataAnnotations and PakDataKit.FluentValidation
# to NuGet when a tag like dotnet-v2.5.0 is pushed, then creates a GitHub
# release. The three packages share the version in dotnet/Directory.Build.props.
#
# How it authenticates, in this order (see RELEASING.md):
# 1. NuGet trusted publishing (GitHub OIDC, no stored key): set the repository
#    variable NUGET_USER to your nuget.org profile name, and add a trusted
#    publishing policy on nuget.org for chmuzamil/pakdatakit,
#    release-dotnet.yml, environment nuget.
# 2. Otherwise the repository secret NUGET_API_KEY.
# 3. Neither set: the packages are built, tested and attested, and the
#    publish is skipped with a notice (the run still succeeds). Configure one
#    of the above and re-run the workflow.
# If all three packages are already on NuGet at this version (for example
# uploaded by hand), the publish is skipped with a notice and the GitHub
# release is still created, so a re-run is safe.

on:
  push:
    tags: ['dotnet-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC token for NuGet trusted publishing and attestations
  attestations: write # build provenance for the .nupkg files

concurrency:
  group: release-dotnet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    env:
      NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
      HAS_API_KEY: ${{ secrets.NUGET_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Check the tag matches dotnet/Directory.Build.props
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' dotnet/Directory.Build.props | head -n 1)"
          if [ "${GITHUB_REF_NAME}" != "dotnet-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match dotnet/Directory.Build.props version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: dotnet build -c Release
        working-directory: dotnet

      - run: dotnet test -c Release --no-build
        working-directory: dotnet

      - run: dotnet pack -c Release --no-build -o artifacts
        working-directory: dotnet

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dotnet/artifacts/*.nupkg

      # Keep the attested files: nuget.org re-signs what it receives, so its
      # copies have different digests and cannot be checked against the
      # attestation. These are also attached to the GitHub release below.
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-attested
          path: dotnet/artifacts/*.nupkg
          if-no-files-found: error

      # Skip the publish when every package is already on NuGet (for example
      # after a first upload by hand); the GitHub release is still created.
      - name: Check which packages are already on NuGet
        id: published
        run: |
          version="${{ steps.version.outputs.version }}"
          exists=true
          for id in PakDataKit PakDataKit.DataAnnotations PakDataKit.FluentValidation; do
            found="$(bash scripts/check-published.sh nuget "$id" "$version")"
            if [ "$found" = "false" ]; then exists=false; fi
          done
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Choose how to authenticate
        id: auth
        if: steps.published.outputs.exists == 'false'
        run: |
          if [ -n "${NUGET_USER}" ]; then
            echo "Using NuGet trusted publishing as ${NUGET_USER}"
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
          elif [ "${HAS_API_KEY}" = "true" ]; then
            echo "Using the NUGET_API_KEY secret"
            echo "mode=key" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Neither the NUGET_USER variable nor the NUGET_API_KEY secret is set; skipping the NuGet publish. See RELEASING.md, then re-run this workflow."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      # Exchanges the GitHub OIDC token for a NuGet API key valid for 1 hour.
      - uses: NuGet/login@v1
        id: login
        if: steps.auth.outputs.mode == 'trusted'
        with:
          user: ${{ env.NUGET_USER }}

      # PakDataKit first: the two adapters depend on the same version of it.
      # --skip-duplicate covers a package that is already there.
      - name: Push to NuGet
        if: steps.auth.outputs.mode == 'trusted' || steps.auth.outputs.mode == 'key'
        working-directory: dotnet/artifacts
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          version="${{ steps.version.outputs.version }}"
          for id in PakDataKit PakDataKit.DataAnnotations PakDataKit.FluentValidation; do
            dotnet nuget push "${id}.${version}.nupkg" --api-key "${NUGET_KEY}" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      # Created when the packages are on NuGet (already, or pushed above), with
      # the attested .nupkg files attached. Verify one with:
      #   gh attestation verify PakDataKit.x.y.z.nupkg --repo chmuzamil/pakdatakit
      # On a re-run, files already attached are kept (never replaced), so the
      # assets stay the ones from the first run and its attestation.
      - name: Create GitHub release
        if: steps.published.outputs.exists == 'true' || steps.auth.outputs.mode == 'trusted' || steps.auth.outputs.mode == 'key'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            node scripts/release-notes.mjs dotnet/CHANGELOG.md "$version" "PakDataKit for .NET" "https://www.nuget.org/packages/PakDataKit/$version" > release-notes.md
            gh release create "${GITHUB_REF_NAME}" --title "PakDataKit for .NET $version" \
              --notes-file release-notes.md --verify-tag --latest=false
          fi
          attached="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          for file in dotnet/artifacts/*.nupkg; do
            if printf '%s\n' "$attached" | grep -qxF "$(basename "$file")"; then
              echo "$(basename "$file") is already attached; keeping it"
            else
              gh release upload "${GITHUB_REF_NAME}" "$file"
            fi
          done
