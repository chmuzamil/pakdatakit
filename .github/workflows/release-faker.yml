name: Release pakdatakit-faker

# Publishes faker/ to npm when a tag like faker-v0.1.0 is pushed, with npm
# trusted publishing and provenance (same setup as release.yml; see RELEASING.md).
# pakdatakit-faker depends on pakdatakit, so release a new pakdatakit first.

on:
  push:
    tags: ['faker-v*.*.*']

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC token for npm trusted publishing

concurrency:
  group: release-faker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            faker/package-lock.json

      - name: Check the tag matches faker/package.json
        run: |
          version="$(node -p "require('./faker/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "faker-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match faker/package.json version ${version}"
            exit 1
          fi

      - name: Check the pakdatakit version it needs is on npm
        run: |
          range="$(node -p "require('./faker/package.json').dependencies.pakdatakit")"
          if ! npm view "pakdatakit@${range}" version | grep -q .; then
            echo "::error::No published pakdatakit matches ${range}; release pakdatakit first"
            exit 1
          fi

      - run: npm ci && npm run build
      - run: npm ci
        working-directory: faker
      - run: npm publish --provenance --access public
        working-directory: faker

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "pakdatakit-faker ${GITHUB_REF_NAME#faker-v}" \
            --notes "See [faker/README.md](https://github.com/chmuzamil/pakdatakit/tree/main/faker)." --verify-tag
