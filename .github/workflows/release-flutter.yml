name: Release Flutter package

# Publishes flutter/ (pakdatakit_flutter on pub.dev) when a tag like
# flutter-v0.1.0 is pushed, using pub.dev automated publishing (GitHub OIDC).
# On pub.dev, the package's Admin tab must enable publishing from GitHub
# Actions for chmuzamil/pakdatakit with tag pattern `flutter-v{{version}}` and
# environment `pub.dev`. Release the Dart pakdatakit core first: this package
# depends on the published version, not on ../dart.

on:
  push:
    tags: ['flutter-v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # OIDC token for pub.dev

    steps:
      - uses: actions/checkout@v4

      # Exchanges the GitHub OIDC token for a pub.dev publishing token.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Use the published pakdatakit, not the in-repo path override.
      - name: Remove the development override
        working-directory: flutter
        run: rm -f pubspec_overrides.yaml

      - run: flutter pub get
        working-directory: flutter

      - run: flutter test
        working-directory: flutter

      - run: flutter pub publish --force
        working-directory: flutter
