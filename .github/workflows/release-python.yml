name: Release Python package

# Publishes python/ to PyPI when a tag like python-v2.2.0 is pushed, using
# PyPI trusted publishing (no API token stored). The project must have this
# repository, `release-python.yml` and environment `pypi` as its trusted
# publisher on pypi.org (see python/RELEASING.md).

on:
  push:
    tags: ['python-v*.*.*']

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC token for PyPI trusted publishing

concurrency:
  group: release-python
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v7

      - name: Check the tag matches pyproject.toml
        working-directory: python
        run: |
          version="$(grep -m1 '^version' pyproject.toml | sed -E 's/version *= *"(.*)"/\1/')"
          if [ "${GITHUB_REF_NAME}" != "python-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi

      - name: Check test vectors and data match the TypeScript library
        run: |
          npm ci
          npm run build
          node scripts/generate-test-vectors.mjs
          git diff --exit-code -- test-vectors python/src/pakdatakit/data

      - name: Test on the oldest and newest supported Python
        working-directory: python
        run: |
          uv run --python 3.9 --with pytest pytest -q
          uv run --python 3.13 --with pytest pytest -q

      - name: Build
        working-directory: python
        run: uv build

      - name: Check whether this version is already on PyPI
        id: published
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/pakdatakit/$version/json")"
          if [ "$status" = "200" ]; then
            echo "pakdatakit $version is already on PyPI; skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.published.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          node scripts/release-notes.mjs python/CHANGELOG.md "$version" "pakdatakit for Python" "https://pypi.org/project/pakdatakit/$version/" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --title "pakdatakit for Python $version" \
            --notes-file release-notes.md --verify-tag --latest=false
