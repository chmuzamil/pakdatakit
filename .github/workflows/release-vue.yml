name: Release pakdatakit-vue

# Publishes vue/ to npm when a tag like vue-v0.1.0 is pushed, with npm
# trusted publishing and provenance (same setup as release.yml; see RELEASING.md).
# pakdatakit-vue has pakdatakit as a peer dependency, so release a new
# pakdatakit first. The first version is published by hand (RELEASING.md).

on:
  push:
    tags: ['vue-v*.*.*']

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC token for npm trusted publishing

concurrency:
  group: release-vue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vue/package-lock.json

      - name: Check the tag matches vue/package.json
        run: |
          version="$(node -p "require('./vue/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "vue-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match vue/package.json version ${version}"
            exit 1
          fi

      - name: Check the pakdatakit version it needs is on npm
        run: |
          range="$(node -p "require('./vue/package.json').peerDependencies.pakdatakit")"
          if ! npm view "pakdatakit@${range}" version | grep -q .; then
            echo "::error::No published pakdatakit matches ${range}; release pakdatakit first"
            exit 1
          fi

      - run: npm ci && npm run build
      - run: npm ci
        working-directory: vue
      - name: Check whether this version is already on npm
        id: published
        run: |
          version="$(node -p "require('./vue/package.json').version")"
          if npm view "pakdatakit-vue@$version" version >/dev/null 2>&1; then
            echo "pakdatakit-vue $version is already on npm; skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm publish --provenance --access public
        if: steps.published.outputs.exists == 'false'
        working-directory: vue

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#vue-v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          node scripts/release-notes.mjs vue/CHANGELOG.md "$version" "pakdatakit-vue" "https://www.npmjs.com/package/pakdatakit-vue/v/$version" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --title "pakdatakit-vue $version" \
            --notes-file release-notes.md --verify-tag --latest=false
