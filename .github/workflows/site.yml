name: Site

# Builds pakdatakit.dev (site/, Astro + Starlight) and deploys it to the VPS.
#
# - Pull requests: build, run the quality gates, and attach the built site to
#   the run as an artifact (there is no preview server).
# - main, core release tags and manual runs: the same, then upload with rsync
#   into a new release folder and "activate" it. Activation switches the site
#   to the new release, checks it through Nginx on the server, and switches
#   back automatically if that check fails.
# - Once the site is live (environment variable PDK_SITE_LIVE = true), the
#   workflow also checks https://pakdatakit.dev/ from outside: healthz.json
#   must report the new release and the main pages must load; otherwise it
#   rolls back.
#
# Quality gates: accessibility (axe, no serious issues, light and dark,
# mobile and desktop), no network requests while a tool runs, no CSP
# violations, internal links, the old API URL redirect map, llms.txt
# (every pakdatakit.dev URL in it exists; every guide, tool and module listed)
# and the Python, Dart, .NET and PHP API reference (check:api: every public
# function and method has a described entry on a built page; the api-data
# job: site/api-data/*.json matches what the extractors read from the source).
#
# The SSH key can only run /usr/local/bin/pdk-deploy on the server
# (upload, activate, rollback, status); it has no shell.

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      # The site is generated from these too.
      - 'src/**'
      - 'data/**'
      - 'DATA.md'
      - '**/CHANGELOG.md'
      - 'typedoc.json'
      - 'tsconfig.json'
      - 'scripts/generate-llms.mjs'
      - 'scripts/generate-test-vectors.mjs'
      - 'scripts/docs-stub.mjs'
      # The Python, Dart, .NET and PHP API reference (site/api-data/).
      - 'python/src/**'
      - 'python/pyproject.toml'
      - 'dart/lib/**'
      - 'dart/pubspec.yaml'
      - 'dotnet/src/**'
      - 'dotnet/Directory.Build.props'
      - 'php/src/**'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      - 'src/**'
      - 'data/**'
      - 'DATA.md'
      - '**/CHANGELOG.md'
      - 'typedoc.json'
      - 'tsconfig.json'
      - 'scripts/generate-llms.mjs'
      - 'scripts/generate-test-vectors.mjs'
      - 'scripts/docs-stub.mjs'
      # The Python, Dart, .NET and PHP API reference (site/api-data/).
      - 'python/src/**'
      - 'python/pyproject.toml'
      - 'dart/lib/**'
      - 'dart/pubspec.yaml'
      - 'dotnet/src/**'
      - 'dotnet/Directory.Build.props'
      - 'php/src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.id.outputs.release }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          # The sitemap's <lastmod> and dateModified come from each page's
          # last commit (site/src/lib/lastmod.mjs).
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Release id
        id: id
        run: echo "release=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # The site imports the core package from the repo (file:..) and runs its
      # TypeDoc and llms.txt scripts.
      - name: Build the core package
        working-directory: .
        run: |
          npm ci
          npm run build

      - run: npm ci

      - name: Every exported module has a guide
        run: npm run check:guides

      - name: Build the site
        run: npm run build

      - name: Old API URLs map to existing pages
        run: npm run check:redirects

      - name: Every public function and method of each port has a described API entry
        run: npm run check:api

      - name: llms.txt links and coverage
        run: npm run check:llms

      - name: Install Chromium for the quality gates
        run: npx playwright install --with-deps chromium

      - name: Accessibility, network and CSP checks
        run: npm run check:quality

      - name: Internal links
        run: |
          npx astro preview --port 4329 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:4329/ && break; sleep 1; done
          npm run check:links

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: quality-report-${{ steps.id.outputs.release }}
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package the release
        run: bash package-release.sh dist "${{ steps.id.outputs.release }}" "$GITHUB_SHA"

      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ steps.id.outputs.release }}
          path: site/dist/
          if-no-files-found: error
          retention-days: 14

  # The Python, Dart, .NET and PHP API reference is rendered at build time
  # from site/api-data/*.json, which the extractors in site/scripts/api/ read
  # from each port's source with that language's own tooling. The JSON is
  # committed so the site builds with Node alone; this job re-extracts it and
  # fails if the committed files are out of date (fix: npm run api:extract in
  # site/, and commit the result). Toolchain versions match ci.yml; the doc
  # tools are pinned in site/scripts/api/ (requirements.txt, dart/pubspec.lock).
  api-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.18

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Python (griffe)
        run: uv run --no-project --python 3.13 --with-requirements site/scripts/api/requirements.txt python site/scripts/api/extract-python.py

      - name: Dart (analyzer)
        run: |
          (cd dart && dart pub get)
          cd site/scripts/api/dart
          dart pub get --enforce-lockfile
          dart run bin/extract.dart

      - name: .NET (reflection and XML documentation)
        working-directory: site/scripts/api/dotnet
        run: dotnet run -c Release

      - name: PHP (tokenizer and docblocks)
        run: php site/scripts/api/extract-php.php

      - name: The committed API data is up to date
        run: |
          if ! git diff --exit-code -- site/api-data; then
            echo "::error::site/api-data is out of date: run npm run api:extract in site/ and commit the result"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- site/api-data)" ]; then
            git status --porcelain -- site/api-data
            echo "::error::site/api-data has files that are not committed"
            exit 1
          fi

  deploy:
    needs: [build, api-data]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: pakdatakit-site
      url: https://pakdatakit.dev/
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    env:
      RELEASE: ${{ needs.build.outputs.release }}
      TARGET: ${{ vars.PDK_DEPLOY_USER }}@${{ vars.PDK_DEPLOY_HOST }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-${{ needs.build.outputs.release }}
          path: dist

      - name: Set up the deploy key
        env:
          KEY: ${{ secrets.PDK_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PDK_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The PDK_DEPLOY_SSH_KEY secret is not set on the pakdatakit-site environment"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/pdk_deploy
          chmod 600 ~/.ssh/pdk_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host pdk
            IdentityFile ~/.ssh/pdk_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
          EOF
          sed -i 's/^          //' ~/.ssh/config
          echo "  HostName ${TARGET#*@}" >> ~/.ssh/config
          echo "  User ${TARGET%@*}" >> ~/.ssh/config

      - name: Upload
        run: rsync -rlpt --chmod=D755,F644 dist/ "pdk:$RELEASE/"

      # Switches to the new release and checks it on the server; switches
      # back by itself (and fails this step) if the check fails.
      - name: Activate
        id: activate
        run: ssh pdk "activate $RELEASE"

      - name: Check the public site
        if: vars.PDK_SITE_LIVE == 'true'
        run: |
          live=
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 15 https://pakdatakit.dev/healthz.json || true)
            case "$body" in *"\"release\":\"$RELEASE\""*) live=1; echo "Live: $body"; break ;; esac
            sleep 10
          done
          if [ -z "$live" ]; then
            echo "::error::https://pakdatakit.dev/healthz.json does not report $RELEASE (got: ${body:-nothing})"
            exit 1
          fi
          for path in / /docs/ /playground/ /api/typescript/ /api/python/ /api/dart/ /api/dotnet/ /api/php/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://pakdatakit.dev$path")
            echo "$path → $code"
            [ "$code" = 200 ] || { echo "::error::https://pakdatakit.dev$path returned $code"; exit 1; }
          done

      - name: Roll back
        if: failure() && steps.activate.outcome == 'success'
        run: ssh pdk rollback

      - name: Status
        if: always()
        run: ssh pdk status || true

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/pdk_deploy
