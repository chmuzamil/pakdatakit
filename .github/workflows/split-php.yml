name: Split PHP package

# Mirrors php/ to the read-only repository chmuzamil/pakdatakit-php when a tag
# like php-v2.3.0 is pushed, and tags the mirror v2.3.0. Packagist reads
# composer.json from the root of a repository, so it follows the mirror; this
# repository stays the source of truth (see RELEASING.md).
#
# Needs a secret named PHP_SPLIT_TOKEN that can push to the mirror. Without it
# the workflow does nothing. After the split it creates the GitHub release for
# the tag, like the other release workflows.

on:
  push:
    tags: ['php-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write # create the GitHub release

concurrency:
  group: split-php
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest

    env:
      PHP_SPLIT_TOKEN: ${{ secrets.PHP_SPLIT_TOKEN }}

    steps:
      - name: Check for the token
        id: token
        run: |
          if [ -z "$PHP_SPLIT_TOKEN" ]; then
            echo "PHP_SPLIT_TOKEN is not set; skipping the split." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'

      # The tag must match the version the package reports.
      - name: Check the version
        if: steps.token.outputs.present == 'true'
        id: version
        run: |
          version="${GITHUB_REF_NAME#php-v}"
          if ! grep -q "PACKAGE_VERSION = '$version'" php/src/PakData.php; then
            echo "Tag $GITHUB_REF_NAME does not match PakData::PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Push php/ to chmuzamil/pakdatakit-php
        if: steps.token.outputs.present == 'true'
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.PHP_SPLIT_TOKEN }}
        with:
          package_directory: php
          repository_organization: chmuzamil
          repository_name: pakdatakit-php
          branch: main
          tag: ${{ steps.version.outputs.tag }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Create GitHub release
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#php-v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          node scripts/release-notes.mjs php/CHANGELOG.md "$version" "pakdatakit for PHP" "https://packagist.org/packages/chmuzamil/pakdatakit#v$version" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --title "pakdatakit for PHP $version" --notes-file release-notes.md --verify-tag --latest=false
