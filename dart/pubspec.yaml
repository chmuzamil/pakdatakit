name: pakdatakit
version: 2.5.1
description: >-
  Pakistani data utilities for Dart and Flutter: validate CNIC, mobile, IBAN,
  NTN/STRN, passport and vehicle numbers; Raast QR codes, banks, postal codes,
  holidays and more.
homepage: https://github.com/chmuzamil/pakdatakit/tree/main/dart#readme
repository: https://github.com/chmuzamil/pakdatakit
issue_tracker: https://github.com/chmuzamil/pakdatakit/issues
documentation: https://chmuzamil.github.io/pakdatakit/

topics:
  - pakistan
  - validation
  - iban
  - cnic
  - qr

environment:
  sdk: ^3.4.0

dev_dependencies:
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.0
