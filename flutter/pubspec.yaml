name: pakdatakit_flutter
version: 0.2.0
description: >-
  Flutter widgets for Pakistani data: CNIC, phone and IBAN fields that format
  as you type, form validators, checkout and KYC forms, and a Raast QR widget.
homepage: https://pakdatakit.dev/install/flutter/
repository: https://github.com/chmuzamil/pakdatakit
issue_tracker: https://github.com/chmuzamil/pakdatakit/issues
documentation: https://pakdatakit.dev/docs/

topics:
  - pakistan
  - validation
  - forms
  - input-formatter
  - qr

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  pakdatakit: ^2.5.0
  qr: ^3.0.2

dev_dependencies:
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
