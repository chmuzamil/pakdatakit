[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pakdatakit"
version = "2.3.0"
description = "Pakistani data utilities for Python: validate CNIC, mobile, IBAN, NTN/STRN, passport and vehicle numbers; Raast QR codes, banks, mobile networks, postal codes, districts, holidays, Hijri dates and amounts in words. No dependencies; gives the same results as the pakdatakit npm package."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Muzamil Chaudhery" }]
keywords = [
  "pakistan", "cnic", "iban", "phone", "raast", "qr", "validation", "ntn",
  "strn", "passport", "vehicle-registration", "postal", "hijri", "holidays",
  "urdu", "address", "amount-in-words",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chmuzamil/pakdatakit/tree/main/python#readme"
Documentation = "https://github.com/chmuzamil/pakdatakit/tree/main/python#readme"
Repository = "https://github.com/chmuzamil/pakdatakit"
Issues = "https://github.com/chmuzamil/pakdatakit/issues"
Changelog = "https://github.com/chmuzamil/pakdatakit/blob/main/python/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pakdatakit"]

[tool.hatch.build.targets.sdist]
include = ["src/pakdatakit", "tests", "README.md", "RELEASING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
