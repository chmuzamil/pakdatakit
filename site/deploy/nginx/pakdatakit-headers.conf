# Security headers for pakdatakit.dev. Included in the server and again in
# every location that adds its own headers (Nginx drops inherited
# add_header directives in that case).
#
# script-src and style-src are not here: every page carries them in a <meta>
# CSP with the SHA-256 of each inline script (site/scripts/csp-hashes.mjs).
# Browsers enforce both policies, so a script-src or default-src here would
# block those hashed scripts. Everything else is locked down here: nothing is
# loaded from or sent to another origin (analytics go to /api/send on this
# site, proxied to Umami).
add_header Content-Security-Policy "img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; media-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
