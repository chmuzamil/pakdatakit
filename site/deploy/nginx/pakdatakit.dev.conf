# pakdatakit.dev: static site (docs, tools, playground), deployed by
# GitHub Actions through /usr/local/bin/pdk-deploy into
# /var/www/pakdatakit.dev/releases/<id>/, served from the "current" symlink.
#
# The repo copy is site/deploy/nginx/pakdatakit.dev.conf; the certbot lines
# below were added on the server by `certbot --nginx`.

server {
    server_name pakdatakit.dev;

    include snippets/block-php-probes.conf;
    root /var/www/pakdatakit.dev/current;
    index index.html;
    error_page 404 /404.html;

    # Adds .mjs (module workers) and .whl to the stock MIME types, for this site only.
    include snippets/pakdatakit-mime.conf;
    gzip_static on;

    access_log /var/log/nginx/sites/$site_log.log sitelog;
    include snippets/pakdatakit-headers.conf;

    if ($request_uri ~ ^/index\.html$) { return 301 /; }

    # Hashed build output and versioned runtimes: cache for a year.
    location ^~ /_astro/ {
        include snippets/pakdatakit-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /runtimes/ {
        include snippets/pakdatakit-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Search index (Pagefind). Fragments, index chunks and .pf_meta files have
    # content hashes in their names; the entry files and WASM do not.
    location ^~ /pagefind/ {
        include snippets/pakdatakit-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
        location ~ ^/pagefind/(fragment|index)/|\.pf_meta$ {
            include snippets/pakdatakit-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
    }

    # Share images: regenerated on every build under the same names.
    location ^~ /og/ {
        include snippets/pakdatakit-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Analytics (Umami at t.chaudhery.com), proxied so the site makes no
    # cross-origin requests: /a.js is the tracker, /api/send records a page or
    # tool view. Same rate limits as t.chaudhery.com. No cookies are set.
    location = /a.js {
        limit_req zone=t_script burst=20 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3100/app.js;
        proxy_http_version 1.1;
        proxy_set_header Host t.chaudhery.com;
        proxy_hide_header Set-Cookie;
        include snippets/pakdatakit-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location = /api/send {
        if ($request_method != POST) { return 405; }
        limit_req zone=t_send burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3100/api/send;
        proxy_http_version 1.1;
        proxy_set_header Host t.chaudhery.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        include snippets/pakdatakit-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz.json {
        include snippets/pakdatakit-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        include snippets/pakdatakit-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pakdatakit.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pakdatakit.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name www.pakdatakit.dev;
    include snippets/block-php-probes.conf;
    return 301 https://pakdatakit.dev$request_uri;

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pakdatakit.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pakdatakit.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = pakdatakit.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pakdatakit.dev;
    return 404; # managed by Certbot


}

server {
    if ($host = www.pakdatakit.dev) {
        return 301 https://pakdatakit.dev$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.pakdatakit.dev;
    return 404; # managed by Certbot


}